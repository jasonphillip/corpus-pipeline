[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-pipeline"
version = "0.1.0"
description = "Local document acquisition, SQLite indexing, and hybrid search"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "sqlite-vec>=0.1.6,<1",
]

[project.optional-dependencies]
code = ["tree-sitter-language-pack>=0.7,<1"]
dev = ["pytest>=8,<10"]

[project.scripts]
corpus = "corpus_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["corpus_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
